name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  backend-tests:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore DooDuckInn.Tests/DooDuckInn.Tests.csproj

      - name: Build
        working-directory: backend
        run: dotnet build DooDuckInn.Tests/DooDuckInn.Tests.csproj --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test DooDuckInn.Tests/DooDuckInn.Tests.csproj --no-build --verbosity normal

  frontend-tests:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --ci

  deploy:
    name: Deploy to AWS
    needs: [changes, backend-tests, frontend-tests]
    if: |
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Amazon.Lambda.Tools
        run: |
          dotnet tool install -g Amazon.Lambda.Tools
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Deploys the API stack first — the digest stack reads its config from the
      # SSM parameters this stack creates, not from its own copy of these secrets.
      - name: Deploy API stack
        working-directory: backend/DooDuckInn
        env:
          COGNITO_AUTHORITY: ${{ secrets.COGNITO_AUTHORITY }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING_DOO_DUCK_INN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SES_SMTP_HOST: ${{ secrets.SES_SMTP_HOST }}
          SES_SMTP_USERNAME: ${{ secrets.SES_SMTP_USERNAME }}
          SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
          SES_FROM_ADDRESS: ${{ secrets.SES_FROM_ADDRESS }}
        run: |
          dotnet lambda deploy-serverless dooduckinn-api \
            --template serverless.template.json \
            --resolve-s3 true \
            --disable-interactive true \
            --template-parameters "CognitoAuthority=${COGNITO_AUTHORITY};CognitoClientId=${COGNITO_CLIENT_ID};ConnectionStringDooDuckInn=\"${CONNECTION_STRING}\";GlmApiKey=${GLM_API_KEY};GmailClientId=${GMAIL_CLIENT_ID};GmailClientSecret=${GMAIL_CLIENT_SECRET};GmailRefreshToken=${GMAIL_REFRESH_TOKEN};SesSmtpHost=${SES_SMTP_HOST};SesSmtpUsername=${SES_SMTP_USERNAME};SesSmtpPassword=${SES_SMTP_PASSWORD};SesFromAddress=${SES_FROM_ADDRESS}"

      - name: Deploy digest stack
        working-directory: backend/DooDuckInn.DigestScanFunction
        run: |
          dotnet lambda deploy-serverless dooduckinn-digest \
            --template serverless.template.json \
            --resolve-s3 true \
            --disable-interactive true

      # A 401 confirms the Lambda actually booted and [Authorize] ran — a crashed or
      # misconfigured deploy shows up here as a 500 or a connection failure instead.
      - name: Smoke test API
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name dooduckinn-api \
            --region ap-southeast-2 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/digests/latest")
          echo "GET /api/digests/latest -> $STATUS"

          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 (unauthenticated request correctly rejected), got $STATUS"
            exit 1
          fi
