name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore DooDuckInn.Tests/DooDuckInn.Tests.csproj

      - name: Build
        working-directory: backend
        run: dotnet build DooDuckInn.Tests/DooDuckInn.Tests.csproj --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test DooDuckInn.Tests/DooDuckInn.Tests.csproj --no-build --verbosity normal

  frontend-tests:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --ci
